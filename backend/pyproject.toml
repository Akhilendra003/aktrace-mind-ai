[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aktrace-mind-ai-backend"
version = "1.0.0"
description = "AkTrace Mind AI API backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.54,<0.55",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: opt-in tests against the configured PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
